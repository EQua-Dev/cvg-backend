spring:
  application:
    name: cvg-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cvg}
    username: ${DATABASE_USERNAME:cvg}
    password: ${DATABASE_PASSWORD:cvg}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

cvg:
  club-id: 00000000-0000-0000-0000-00000000c0c0
  # First admin, created on startup when the club has no members yet.
  bootstrap:
    admin-phone: ${CVG_BOOTSTRAP_ADMIN_PHONE:}
    admin-name: ${CVG_BOOTSTRAP_ADMIN_NAME:}
  auth:
    otp-ttl: 10m
    otp-max-attempts: 5
    otp-max-requests-per-hour: 5
    session-ttl: 60d
    cookie-name: cvg_session
    cookie-domain: ${CVG_COOKIE_DOMAIN:}
    cookie-secure: ${CVG_COOKIE_SECURE:true}
  sms:
    # "log" prints codes to the server log (development). "termii" sends real SMS.
    provider: ${CVG_SMS_PROVIDER:log}
    termii:
      base-url: ${TERMII_BASE_URL:https://api.ng.termii.com}
      api-key: ${TERMII_API_KEY:}
      sender-id: ${TERMII_SENDER_ID:CVG FC}
  cors:
    allowed-origins: ${CVG_CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
