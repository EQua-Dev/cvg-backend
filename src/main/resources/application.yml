spring:
  application:
    name: cvg-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cvg}
    username: ${DATABASE_USERNAME:cvg}
    password: ${DATABASE_PASSWORD:cvg}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

cvg:
  club-id: 00000000-0000-0000-0000-00000000c0c0
  # First admin, created on startup when the club has no members yet.
  bootstrap:
    admin-phone: ${CVG_BOOTSTRAP_ADMIN_PHONE:}
    admin-name: ${CVG_BOOTSTRAP_ADMIN_NAME:}
  auth:
    passcode-max-attempts: 5
    passcode-lockout: 15m
    session-ttl: 60d
    cookie-name: cvg_session
    cookie-domain: ${CVG_COOKIE_DOMAIN:}
    cookie-secure: ${CVG_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CVG_CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  links:
    club-app: ${CVG_CLUB_APP_URL:http://localhost:3002}
    public-site: ${CVG_PUBLIC_SITE_URL:http://localhost:3000}
    verify-secret: ${CVG_VERIFY_SECRET:dev-only-change-me}
  onboarding:
    link-ttl: 14d
  training:
    availability-cutoff: 2h
    days-ahead: 14
